<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>金属活动性实验台</title>
<style>
  /* one full-bleed WebGL view; labels and the caption float over it. A single dark chrome by design. */
  :root { color-scheme: dark; --bg: #0b0c0d; --fg: #e8eaec; --dim: rgba(255,255,255,.62); --faint: rgba(255,255,255,.5); --shade: rgba(0,0,0,.55); --card: rgba(18,20,23,.78); --line: rgba(255,255,255,.16); --accent: #ffd27a; --err-bg: rgba(90,10,10,.88); --err-fg: #fff;
    --ui: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif; --mono: ui-monospace, Menlo, monospace; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: var(--bg); color: var(--fg); font-family: var(--ui); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; outline: none; }
  #view.pick { cursor: pointer; }
  #view.carry { cursor: grabbing; }
  #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .tag { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); white-space: nowrap; padding: 4px 10px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-size: 14px; letter-spacing: .04em; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); will-change: transform; }
  .tag small { color: var(--dim); font-size: 12px; margin-left: 6px; font-variant-numeric: tabular-nums; }
  .tag.hint { border-color: var(--accent); color: var(--accent); }
  .tag.vessel { display: flex; align-items: center; gap: 8px; padding-right: 4px; min-height: 36px; box-sizing: border-box; }
  .tag.vessel small { margin-left: -2px; }
  .tag .status { font-style: normal; font-size: 12px; color: var(--accent); }
  .tag .status.quiet { color: var(--fg); }
  .tag .status:empty { display: none; }
  .tag .clear { pointer-events: auto; min-height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--fg); font: 12px var(--ui); cursor: pointer; position: relative; }
  .tag .clear::after { content: ""; position: absolute; inset: -9px -6px; } /* a 44 px touch target around a small pill */
  .tag .clear:hover { border-color: var(--accent); color: var(--accent); }
  .tag .clear:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tag .clear[hidden] { display: none; }
  .tag.vessel:not(:has(.clear:not([hidden]))) { padding-right: 10px; }
  #caption { position: fixed; left: 16px; right: 16px; bottom: calc(44px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; width: fit-content; max-width: min(720px, calc(100vw - 32px)); box-sizing: border-box; padding: 12px 18px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); opacity: 0; transition: opacity .5s ease; pointer-events: none; }
  #caption.on { opacity: 1; }
  #caption b { display: block; font-size: 17px; font-weight: 600; letter-spacing: .03em; }
  #caption span { display: block; margin-top: 4px; font-size: 14px; color: var(--dim); font-variant-numeric: tabular-nums; }
  #caption span:empty { display: none; }
  #caption em { display: block; margin-top: 4px; font-size: 13px; font-style: normal; color: var(--accent); }
  #hud, #hint { position: fixed; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); font-size: 11px; letter-spacing: .04em; pointer-events: none; text-shadow: 0 1px 2px var(--shade); }
  #hud { left: max(16px, env(safe-area-inset-left, 0px)); color: var(--dim); font-variant-numeric: tabular-nums; }
  #hint { right: max(16px, env(safe-area-inset-right, 0px)); color: var(--faint); }
  #reset { position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(12px + env(safe-area-inset-top, 0px)); min-height: 44px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font: 14px var(--ui); cursor: pointer; }
  #reset:hover { border-color: var(--accent); }
  #reset:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #boot { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: var(--bg); color: var(--fg); transition: opacity .9s ease; z-index: 5; }
  #boot.gone { opacity: 0; pointer-events: none; }
  #boot b { font-size: 22px; font-weight: 500; letter-spacing: .3em; }
  #boot span { font-size: 12px; opacity: .55; letter-spacing: .12em; }
  #err { display: none; position: fixed; left: max(16px, env(safe-area-inset-left, 0px)); top: calc(66px + env(safe-area-inset-top, 0px)); max-width: 70vw; max-height: 60vh; overflow: auto; white-space: pre-wrap; background: var(--err-bg); color: var(--err-fg); font: 11px/1.4 var(--mono); padding: 8px 10px; border-radius: 6px; z-index: 9; margin: 0; }
  body.still #boot, body.still #caption { transition: none; }
  body.clean #hud, body.clean #hint, body.clean .lil-gui, body.clean #reset { display: none; }
  .lil-gui { --font-size: 12px; --font-family: var(--ui); }
  .lil-gui.root { top: env(safe-area-inset-top, 0px); right: max(15px, env(safe-area-inset-right, 0px)); max-width: calc(100vw - 32px); }
  @media (max-width: 900px) { #hint { display: none; } .tag { font-size: 12px; } .tag.vessel small { display: none; } }
  /* a phone held upright: four vessels share 375 px, so each label stacks its name, status and button */
  @media (max-width: 600px) { .tag { font-size: 11px; padding: 3px 6px; } .tag.vessel { flex-direction: column; gap: 2px; padding: 4px 6px; border-radius: 10px; } .tag .status { font-size: 11px; } }
  @media (prefers-reduced-motion: reduce) { #boot, #caption { transition: none; } }
</style>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>
<div id="labels"></div>
<div id="caption" role="status" aria-live="polite"><b></b><span></span><em hidden></em></div>
<button id="reset" type="button">重置实验</button>
<div id="hud"></div>
<div id="hint">把金属拖进烧杯，或先点金属再点烧杯 · 拖空白处转视角 · 滚轮缩放 · R 重置</div>
<div id="boot"><b>实验台</b><span>正在布置器材</span></div>
<pre id="err"></pre>
<script>/*__BUNDLE__*/</script>
</body>
</html>
